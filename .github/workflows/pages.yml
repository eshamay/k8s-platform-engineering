name: Build & deploy Pages site

# Builds the Jekyll site from outputs/ (bin/build_site.py --strict, then Jekyll with
# Just-the-Docs) and deploys it to GitHub Pages from this same repository.
#
# One-time repo setting: Settings -> Pages -> Source = "GitHub Actions".
# Every action is pinned to a full commit SHA (resolved from the version tag in the comment);
# review and update the SHAs deliberately, never by moving a tag.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "outputs/**"
      - "site_overlay/**"
      - ".sticki-publish.json"
      - "bin/build_site.py"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/pages.yml"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f  # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.x"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - name: Generate the Jekyll tree from the vault (strict)
        run: python3 bin/build_site.py --strict
      - name: Jekyll build
        run: bundle exec jekyll build --source build --destination _site
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
