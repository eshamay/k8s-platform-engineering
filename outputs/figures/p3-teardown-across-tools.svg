<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-label="Five rows, one per tool (Argo CD, Flux, kro, Cluster API, Crossplane), each linking the tool to the mechanism that controls its teardown and then to how deletion proceeds."><title>How each tool controls teardown</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="530" fill="#ffffff"/><rect x="20" y="20" width="960" height="490" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="130.0" y="56.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle"><tspan x="130.0" dy="0.0">Tool</tspan></text><text x="430.0" y="56.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle"><tspan x="430.0" dy="0.0">What controls teardown</tspan></text><text x="810.0" y="56.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle"><tspan x="810.0" dy="0.0">How it proceeds</tspan></text><rect x="40" y="80" width="180" height="64" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="130.0" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">Argo CD</tspan></text><rect x="300" y="80" width="260" height="64" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="430.0" y="108.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="430.0" dy="0.0">Finalizer on</tspan><tspan x="430.0" dy="20.0">the Application</tspan></text><rect x="680" y="80" width="260" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="810.0" y="108.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="810.0" dy="0.0">Application stays</tspan><tspan x="810.0" dy="20.0">until finalizer clears</tspan></text><polyline points="220.0,112.0 300.0,112.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="560.0,112.0 680.0,112.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><rect x="40" y="164" width="180" height="64" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="130.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">Flux</tspan></text><rect x="300" y="164" width="260" height="64" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="430.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="430.0" dy="0.0">Kustomization</tspan><tspan x="430.0" dy="20.0">garbage collection</tspan></text><rect x="680" y="164" width="260" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="810.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="810.0" dy="0.0">Deletion policy</tspan><tspan x="810.0" dy="20.0">chooses what happens</tspan></text><polyline points="220.0,196.0 300.0,196.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="560.0,196.0 680.0,196.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><rect x="40" y="248" width="180" height="64" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="130.0" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">kro</tspan></text><rect x="300" y="248" width="260" height="64" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="430.0" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="430.0" dy="0.0">Finalizer on</tspan><tspan x="430.0" dy="20.0">the instance</tspan></text><rect x="680" y="248" width="260" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="810.0" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="810.0" dy="0.0">Waits for all resources,</tspan><tspan x="810.0" dy="20.0">reverse-dependency waves</tspan></text><polyline points="220.0,280.0 300.0,280.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="560.0,280.0 680.0,280.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><rect x="40" y="332" width="180" height="64" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="130.0" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">Cluster API</tspan></text><rect x="300" y="332" width="260" height="64" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="430.0" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="430.0" dy="0.0">Machine</tspan><tspan x="430.0" dy="20.0">deletionTimestamp</tspan></text><rect x="680" y="332" width="260" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="810.0" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="810.0" dy="0.0">Annotation hooks</tspan></text><polyline points="220.0,364.0 300.0,364.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="560.0,364.0 680.0,364.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><rect x="40" y="416" width="180" height="64" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="130.0" y="454.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">Crossplane</tspan></text><rect x="300" y="416" width="260" height="64" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="430.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="430.0" dy="0.0">Owner references to</tspan><tspan x="430.0" dy="20.0">the composite</tspan></text><rect x="680" y="416" width="260" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="810.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="810.0" dy="0.0">Ordered or</tspan><tspan x="810.0" dy="20.0">unordered teardown</tspan></text><polyline points="220.0,448.0 300.0,448.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="560.0,448.0 680.0,448.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/></svg>
