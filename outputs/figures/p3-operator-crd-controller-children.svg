<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="554" viewBox="0 0 1000 554" role="img" aria-label="An application team writes a PostgresCluster object to the API server, whose new kind comes from a CRD and whose objects are stored in etcd; a controller watches the object, creates StatefulSets, Services and Secrets, and writes progress back to status."><title>A custom kind and its controller</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="554" fill="#ffffff"/><rect x="20" y="20" width="960" height="430" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="35" y="180" width="170" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="120.0" y="216.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="120.0" dy="0.0">Application team</tspan><tspan x="120.0" dy="18.8">writes the object</tspan></text><rect x="310" y="160" width="190" height="120" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="405.0" y="216.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="405.0" dy="0.0">API server</tspan><tspan x="405.0" dy="20.0">serves the new kind</tspan></text><rect x="280" y="350" width="150" height="70" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="355.0" y="371.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="355.0" dy="0.0">CRD</tspan><tspan x="355.0" dy="18.8">model and</tspan><tspan x="355.0" dy="18.8">endpoint</tspan></text><rect x="460" y="350" width="100" height="70" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="510.0" y="381.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="510.0" dy="0.0">etcd</tspan><tspan x="510.0" dy="18.8">storage</tspan></text><rect x="590" y="180" width="150" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="665.0" y="216.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="665.0" dy="0.0">Controller</tspan><tspan x="665.0" dy="18.8">holds behavior</tspan></text><rect x="810" y="70" width="150" height="60" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="885.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="885.0" dy="0.0">StatefulSets</tspan></text><rect x="810" y="190" width="150" height="60" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="885.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="885.0" dy="0.0">Services</tspan></text><rect x="810" y="310" width="150" height="60" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="885.0" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="885.0" dy="0.0">Secrets</tspan></text><polyline points="205.0,220.0 310.0,220.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="238.2" y="188.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="238.2" dy="0.0">write</tspan></text><polyline points="355.0,350.0 348.0,280.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="235.3" y="305.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="235.3" dy="0.0">defines kind</tspan></text><polyline points="462.0,280.0 510.0,350.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="502.9" y="305.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="502.9" dy="0.0">stores</tspan></text><polyline points="500.0,220.0 590.0,220.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="525.8" y="188.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9c36b5" text-anchor="start"><tspan x="525.8" dy="0.0">watch</tspan></text><polyline points="740.0,220.0 810.0,100.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="700.0" y="164.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="700.0" dy="0.0">create</tspan></text><polyline points="740.0,220.0 810.0,220.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><polyline points="740.0,220.0 810.0,340.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><polyline points="665.0,180.0 665.0,100.0 405.0,100.0 405.0,160.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="520.0" y="92.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#099268" text-anchor="start"><tspan x="520.0" dy="0.0">status</tspan></text><rect x="20" y="480" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,512.0 100.0,512.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="112.0" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">write or create</tspan></text><polyline points="267.5,512.0 327.5,512.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="339.5" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="339.5" dy="0.0">watch for changes</tspan></text><polyline points="510.4,512.0 570.4,512.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="582.4" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="582.4" dy="0.0">status written back</tspan></text><polyline points="768.7,512.0 828.7,512.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="840.7" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="840.7" dy="0.0">defines or stores</tspan></text></svg>
