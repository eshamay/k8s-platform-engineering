<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="554" viewBox="0 0 1000 554" role="img" aria-label="A client asks the API server for a version, the server converts through the hub version, which two spoke versions connect to in both directions, and the object is stored in etcd as the storage version, with an optional conversion webhook service called by the API server."><title>CRD conversion through a hub version</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="554" fill="#ffffff"/><rect x="30" y="215" width="140" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="100.0" y="241.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="100.0" dy="0.0">Client</tspan><tspan x="100.0" dy="18.8">asks for a</tspan><tspan x="100.0" dy="18.8">version</tspan></text><rect x="250" y="215" width="160" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="330.0" y="241.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="330.0" dy="0.0">API server</tspan><tspan x="330.0" dy="18.8">converts on the</tspan><tspan x="330.0" dy="18.8">fly</tspan></text><rect x="500" y="215" width="160" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="580.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="580.0" dy="0.0">Hub version</tspan></text><rect x="235" y="380" width="190" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="330.0" y="416.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="330.0" dy="0.0">etcd</tspan><tspan x="330.0" dy="18.8">storage version</tspan></text><rect x="780" y="80" width="160" height="70" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="860.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="860.0" dy="0.0">Spoke version</tspan></text><rect x="780" y="350" width="160" height="70" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="860.0" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="860.0" dy="0.0">Spoke version</tspan></text><rect x="250" y="50" width="160" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2" stroke-dasharray="8 6"/><text x="330.0" y="76.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="330.0" dy="0.0">Conversion</tspan><tspan x="330.0" dy="18.8">webhook</tspan><tspan x="330.0" dy="18.8">service</tspan></text><text x="430.0" y="95.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="430.0" dy="0.0">Optional: only with the</tspan><tspan x="430.0" dy="18.8">Webhook strategy</tspan></text><text x="735.0" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="735.0" dy="0.0">Spokes talk only to the hub</tspan></text><polyline points="170.0,255.0 250.0,255.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="183.1" y="245.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="183.1" dy="0.0">request</tspan></text><polyline points="410.0,255.0 500.0,255.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="428.1" y="245.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="428.1" dy="0.0">convert</tspan></text><polyline points="330.0,295.0 330.0,380.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="233.8" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#099268" text-anchor="start"><tspan x="233.8" dy="0.0">stored as storage version</tspan></text><polyline points="780.0,115.0 660.0,255.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)" marker-start="url(#m-dark)"/><polyline points="780.0,385.0 660.0,255.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)" marker-start="url(#m-dark)"/><polyline points="330.0,215.0 330.0,130.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)" marker-start="url(#m-blue)"/><rect x="20" y="480" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,512.0 100.0,512.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="112.0" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">request or call</tspan></text><polyline points="267.5,512.0 327.5,512.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="339.5" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="339.5" dy="0.0">conversion</tspan></text><polyline points="456.5,512.0 516.5,512.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="528.5" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="528.5" dy="0.0">write to storage</tspan></text></svg>
