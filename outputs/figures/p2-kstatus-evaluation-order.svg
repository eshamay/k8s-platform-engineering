<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="A top-to-bottom flowchart of kstatus checks: a deletion timestamp gives Terminating, a generation mismatch gives InProgress, Reconciling or Stalled conditions give InProgress or Failed, and the Ready fallback gives Current or InProgress."><title>The kstatus decision order</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="580" fill="#ffffff"/><rect x="60" y="40" width="340" height="70" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="230.0" y="71.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="230.0" dy="0.0">1. Deletion timestamp</tspan><tspan x="230.0" dy="20.0">set?</tspan></text><rect x="60" y="160" width="340" height="70" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="230.0" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="230.0" dy="0.0">2. generation differs from</tspan><tspan x="230.0" dy="20.0">status.observedGeneration?</tspan></text><rect x="60" y="280" width="340" height="110" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="230.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="230.0" dy="0.0">3. Conditions, in array order</tspan><tspan x="230.0" dy="20.0">Reconciling or Stalled</tspan><tspan x="230.0" dy="20.0">(first match wins)</tspan></text><rect x="60" y="440" width="340" height="100" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="230.0" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="230.0" dy="0.0">4. Type-specific rules,</tspan><tspan x="230.0" dy="20.0">then Ready condition</tspan></text><rect x="620" y="45" width="320" height="60" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="780.0" y="81.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="780.0" dy="0.0">Terminating</tspan></text><rect x="620" y="155" width="320" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="780.0" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="780.0" dy="0.0">InProgress</tspan><tspan x="780.0" dy="20.0">LatestGenerationNotObserved</tspan></text><rect x="620" y="275" width="320" height="50" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="780.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="780.0" dy="0.0">InProgress</tspan><tspan x="780.0" dy="20.0">Reconciling=True</tspan></text><rect x="620" y="335" width="320" height="50" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="780.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="780.0" dy="0.0">Failed</tspan><tspan x="780.0" dy="20.0">Stalled=True</tspan></text><rect x="620" y="430" width="320" height="50" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="780.0" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="780.0" dy="0.0">Current</tspan><tspan x="780.0" dy="20.0">Ready=True</tspan></text><rect x="620" y="500" width="320" height="50" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="780.0" y="521.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="780.0" dy="0.0">InProgress</tspan><tspan x="780.0" dy="20.0">Ready False or Unknown</tspan></text><polyline points="230.0,110.0 230.0,160.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="243.8" y="125.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="243.8" dy="0.0">no</tspan></text><polyline points="230.0,230.0 230.0,280.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="243.8" y="245.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="243.8" dy="0.0">no</tspan></text><polyline points="230.0,390.0 230.0,440.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="243.1" y="405.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="243.1" dy="0.0">neither</tspan></text><polyline points="400.0,75.0 620.0,75.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="497.6" y="65.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="497.6" dy="0.0">yes</tspan></text><polyline points="400.0,195.0 620.0,195.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="497.6" y="185.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="497.6" dy="0.0">yes</tspan></text><polyline points="400.0,302.0 620.0,300.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="464.6" y="279.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="464.6" dy="0.0">Reconciling</tspan></text><polyline points="400.0,368.0 620.0,360.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="481.1" y="354.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="481.1" dy="0.0">Stalled</tspan></text><polyline points="400.0,450.0 620.0,455.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="493.5" y="442.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="493.5" dy="0.0">True</tspan></text><polyline points="400.0,530.0 620.0,525.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="444.0" y="517.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="444.0" dy="0.0">False or Unknown</tspan></text></svg>
