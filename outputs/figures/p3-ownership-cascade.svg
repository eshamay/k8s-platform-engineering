<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="564" viewBox="0 0 1000 564" role="img" aria-label="A Deployment owns ReplicaSets, which own pods; a delete call removes the Deployment at once, then the garbage collector deletes the ownerless ReplicaSets and then the ownerless pods"><title>Ownership and the delete cascade</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="564" fill="#ffffff"/><text x="40.0" y="46.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start"><tspan x="40.0" dy="0.0">Ownership: each object is owned by the one to its left</tspan></text><rect x="40" y="100" width="200" height="90" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="140.0" y="151.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="140.0" dy="0.0">Deployment</tspan></text><rect x="400" y="100" width="200" height="90" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="500.0" y="151.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">ReplicaSets</tspan></text><rect x="760" y="100" width="200" height="90" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="860.0" y="151.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="860.0" dy="0.0">Pods</tspan></text><rect x="40" y="340" width="200" height="90" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="140.0" y="371.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="140.0" dy="0.0">Delete call</tspan><tspan x="140.0" dy="18.8">names only the</tspan><tspan x="140.0" dy="18.8">Deployment</tspan></text><rect x="400" y="340" width="200" height="90" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="500.0" y="381.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">Garbage collector</tspan><tspan x="500.0" dy="18.8">dependency graph</tspan></text><polyline points="240.0,145.0 400.0,145.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="303.5" y="135.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="303.5" dy="0.0">owns</tspan></text><polyline points="600.0,145.0 760.0,145.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="663.5" y="135.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="663.5" dy="0.0">owns</tspan></text><polyline points="140.0,340.0 140.0,190.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="153.1" y="255.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e03131" text-anchor="start"><tspan x="153.1" dy="0.0">removed at once</tspan></text><polyline points="500.0,340.0 500.0,190.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="520.5" y="255.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e03131" text-anchor="start"><tspan x="520.5" dy="0.0">then deleted</tspan></text><polyline points="600.0,385.0 860.0,385.0 860.0,190.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="700.0" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e03131" text-anchor="start"><tspan x="700.0" dy="0.0">next, collected</tspan></text><rect x="20" y="490" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,522.0 100.0,522.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="112.0" y="527.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">owns</tspan></text><polyline points="185.0,522.0 245.0,522.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="257.0" y="527.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="257.0" dy="0.0">deleted</tspan></text></svg>
