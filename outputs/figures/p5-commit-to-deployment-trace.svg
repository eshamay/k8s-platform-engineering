<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="604" viewBox="0 0 1000 604" role="img" aria-label="A Git commit is fetched by the Flux source controller, handed to the kustomize controller, applied to the API server with server-side apply, and carried on by the Deployment controller to a ReplicaSet and pods, with an optional webhook through the notification controller."><title>From a Git commit to a running Deployment</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="604" fill="#ffffff"/><rect x="20" y="20" width="960" height="440" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="80" width="130" height="80" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="105.0" y="116.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="105.0" dy="0.0">Git</tspan><tspan x="105.0" dy="18.8">repository</tspan></text><rect x="280" y="80" width="160" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="360.0" y="106.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="360.0" dy="0.0">Source</tspan><tspan x="360.0" dy="18.8">controller</tspan><tspan x="360.0" dy="18.8">GitRepository</tspan></text><rect x="560" y="80" width="160" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="640.0" y="106.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="640.0" dy="0.0">Kustomize</tspan><tspan x="640.0" dy="18.8">controller</tspan><tspan x="640.0" dy="18.8">Kustomization</tspan></text><rect x="840" y="80" width="120" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="900.0" y="125.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="900.0" dy="0.0">API server</tspan></text><rect x="40" y="320" width="190" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="135.0" y="346.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="135.0" dy="0.0">Notification</tspan><tspan x="135.0" dy="18.8">controller</tspan><tspan x="135.0" dy="18.8">(optional webhook)</tspan></text><rect x="840" y="320" width="120" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="900.0" y="356.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="900.0" dy="0.0">Deployment</tspan><tspan x="900.0" dy="18.8">controller</tspan></text><rect x="560" y="320" width="160" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="640.0" y="356.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="640.0" dy="0.0">ReplicaSet</tspan><tspan x="640.0" dy="18.8">and pods</tspan></text><polyline points="280.0,120.0 170.0,120.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="205.8" y="88.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="205.8" dy="0.0">fetch</tspan></text><polyline points="440.0,120.0 560.0,120.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="469.2" y="88.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="469.2" dy="0.0">artifact</tspan></text><polyline points="720.0,120.0 840.0,120.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="737.6" y="71.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="737.6" dy="0.0">server-side</tspan><tspan x="737.6" dy="17.5">apply</tspan></text><polyline points="105.0,160.0 135.0,320.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="138.1" y="230.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="138.1" dy="0.0">webhook</tspan></text><polyline points="230.0,360.0 360.0,360.0 360.0,160.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="425.0" y="274.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="425.0" dy="0.0">refresh now</tspan></text><polyline points="900.0,160.0 900.0,320.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="785.0" y="230.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9c36b5" text-anchor="start"><tspan x="785.0" dy="0.0">new image tag</tspan></text><polyline points="840.0,360.0 720.0,360.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="753.0" y="328.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="753.0" dy="0.0">creates</tspan></text><rect x="20" y="530" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,562.0 100.0,562.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="112.0" y="566.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">fetch</tspan></text><polyline points="190.5,562.0 250.5,562.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="262.5" y="566.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="262.5" dy="0.0">hand-off</tspan></text><polyline points="364.1,562.0 424.1,562.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="436.1" y="566.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="436.1" dy="0.0">write or command</tspan></text><polyline points="599.3,562.0 659.3,562.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="671.3" y="566.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="671.3" dy="0.0">watch</tspan></text></svg>
