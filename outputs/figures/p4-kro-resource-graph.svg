<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="624" viewBox="0 0 1000 624" role="img" aria-label="A ResourceGraphDefinition schema generates a CRD and registers a dynamic controller that reconciles an instance graph, in which the bucket is created before the deployment because of the ARN reference, independent resources are created in parallel, and deletion runs in reverse order."><title>How kro builds an ordered resource graph</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="624" fill="#ffffff"/><rect x="20" y="20" width="340" height="400" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="40.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9c36b5" text-anchor="start"><tspan x="40.0" dy="0.0">ResourceGraphDefinition</tspan></text><rect x="50" y="65" width="280" height="70" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="190.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" dy="0.0">schema</tspan><tspan x="190.0" dy="20.0">(declares the new kind)</tspan></text><rect x="50" y="190" width="280" height="70" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="190.0" y="231.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" dy="0.0">Generated CRD</tspan></text><rect x="50" y="320" width="280" height="70" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="190.0" y="351.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" dy="0.0">Dynamic controller</tspan><tspan x="190.0" dy="20.0">(reconciles instances)</tspan></text><polyline points="190.0,135.0 190.0,190.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="155.3" y="153.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="155.3" dy="0.0">generates</tspan></text><polyline points="190.0,260.0 190.0,320.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="155.3" y="280.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="155.3" dy="0.0">registers</tspan></text><rect x="500" y="190" width="480" height="330" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="520.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9c36b5" text-anchor="start"><tspan x="520.0" dy="0.0">Resources built for one instance</tspan></text><rect x="520" y="250" width="150" height="70" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="595.0" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="595.0" dy="0.0">Bucket</tspan><tspan x="595.0" dy="20.0">created first</tspan></text><rect x="810" y="250" width="150" height="70" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="885.0" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="885.0" dy="0.0">Deployment</tspan><tspan x="885.0" dy="20.0">created second</tspan></text><text x="520.0" y="435.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9c36b5" text-anchor="start"><tspan x="520.0" dy="0.0">Independent resources, created in parallel</tspan></text><rect x="520" y="445" width="170" height="55" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="605.0" y="478.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="605.0" dy="0.0">Resource A</tspan></text><rect x="790" y="445" width="170" height="55" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="875.0" y="478.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="875.0" dy="0.0">Resource B</tspan></text><polyline points="330.0,355.0 500.0,355.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="376.5" y="345.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="376.5" dy="0.0">reconciles</tspan></text><polyline points="670.0,285.0 810.0,285.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="674.5" y="257.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="674.5" dy="0.0">ARN feeds env var</tspan></text><polyline points="885.0,320.0 885.0,360.0 595.0,360.0 595.0,320.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="740.0" y="392.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="740.0" dy="0.0">deleted first, bucket last</tspan></text><rect x="20" y="550" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,582.0 100.0,582.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="112.0" y="586.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">generates, registers, feeds</tspan></text><polyline points="359.9,582.0 419.9,582.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="431.9" y="586.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="431.9" dy="0.0">teardown order</tspan></text></svg>
