<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="574" viewBox="0 0 1000 574" role="img" aria-label="Two lanes: a render tool produces manifests that a GitOps tool fetches and applies to the cluster, while a live controller watches a parent API object, reconciles child resources, writes status back to the parent and deletes children in order."><title>Render-time tools versus controller-driven abstractions</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="574" fill="#ffffff"/><rect x="20" y="20" width="960" height="230" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="40.0" y="48.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9c36b5" text-anchor="start"><tspan x="40.0" dy="0.0">Render-time family: produce manifests once</tspan></text><rect x="50" y="100" width="170" height="90" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="135.0" y="141.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="135.0" dy="0.0">Render tool</tspan><tspan x="135.0" dy="20.0">Helm, Kustomize</tspan></text><rect x="320" y="100" width="140" height="90" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="390.0" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="390.0" dy="0.0">Manifests</tspan><tspan x="390.0" dy="20.0">(emitted</tspan><tspan x="390.0" dy="20.0">once)</tspan></text><rect x="560" y="100" width="160" height="90" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="640.0" y="141.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="640.0" dy="0.0">GitOps tool</tspan><tspan x="640.0" dy="20.0">Flux, Argo CD</tspan></text><rect x="840" y="100" width="120" height="90" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="900.0" y="141.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="900.0" dy="0.0">Cluster</tspan><tspan x="900.0" dy="20.0">resources</tspan></text><polyline points="220.0,145.0 320.0,145.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="245.2" y="135.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="245.2" dy="0.0">render</tspan></text><polyline points="460.0,145.0 560.0,145.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="489.4" y="135.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="489.4" dy="0.0">fetch</tspan></text><polyline points="720.0,145.0 840.0,145.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="726.4" y="135.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2" text-anchor="start"><tspan x="726.4" dy="0.0">keeps correct</tspan></text><rect x="20" y="280" width="960" height="200" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="40.0" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9c36b5" text-anchor="start"><tspan x="40.0" dy="0.0">Controller-driven family: the abstraction is itself an API</tspan></text><rect x="50" y="360" width="200" height="100" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="150.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="150.0" dy="0.0">Parent object</tspan><tspan x="150.0" dy="20.0">in the API</tspan></text><rect x="410" y="360" width="190" height="100" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="505.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="505.0" dy="0.0">Live controller</tspan><tspan x="505.0" dy="20.0">(reconcile loop)</tspan></text><rect x="790" y="360" width="170" height="100" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="875.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="875.0" dy="0.0">Child</tspan><tspan x="875.0" dy="20.0">resources</tspan></text><polyline points="410.0,390.0 250.0,390.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="309.4" y="380.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9c36b5" text-anchor="start"><tspan x="309.4" dy="0.0">watch</tspan></text><polyline points="600.0,390.0 790.0,390.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="657.9" y="380.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2" text-anchor="start"><tspan x="657.9" dy="0.0">reconcile</tspan></text><polyline points="600.0,435.0 790.0,435.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="637.2" y="425.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e03131" text-anchor="start"><tspan x="637.2" dy="0.0">ordered delete</tspan></text><polyline points="410.0,435.0 250.0,435.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="305.2" y="425.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#099268" text-anchor="start"><tspan x="305.2" dy="0.0">status</tspan></text><rect x="20" y="500" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,532.0 100.0,532.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="112.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">render</tspan></text><polyline points="201.5,532.0 261.5,532.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="273.5" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="273.5" dy="0.0">fetch</tspan></text><polyline points="354.8,532.0 414.8,532.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="426.8" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="426.8" dy="0.0">apply</tspan></text><polyline points="508.0,532.0 568.0,532.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="580.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="580.0" dy="0.0">watch</tspan></text><polyline points="661.2,532.0 721.2,532.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="733.2" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="733.2" dy="0.0">status</tspan></text><polyline points="822.8,532.0 882.8,532.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="894.8" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="894.8" dy="0.0">teardown</tspan></text></svg>
