 stroke="#495057" stroke-width="2"/><text x="305.0" y="207.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="305.0" dy="0.0">Kustomize</tspan><tspan x="305.0" dy="20.0">patches</tspan></text><rect x="765" y="145" width="140" height="70" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="835.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="835.0" dy="0.0">Score</tspan></text><rect x="495" y="322" width="160" height="62" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="575.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="575.0" dy="0.0">Crossplane</tspan><tspan x="575.0" dy="20.0">typed API</tspan></text><rect x="495" y="394" width="160" height="62" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="575.0" y="421.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="575.0" dy="0.0">kro</tspan><tspan x="575.0" dy="20.0">typed API</tspan></text><rect x="765" y="358" width="140" height="70" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="835.0" y="399.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="835.0" dy="0.0">Radius</tspan></text><rect x="200" y="252" width="750" height="34" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="575.0" y="275.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="575.0" dy="0.0">Continuous correction is a GitOps tool&#x27;s job</tspan></text><rect x="200" y="462" width="750" height="48" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="575.0" y="482.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="575.0" dy="0.0">Drift correction, ordered deletion;</tspan><tspan x="575.0" dy="20.0">the control plane becomes a production dependency</tspan></text></svg>
