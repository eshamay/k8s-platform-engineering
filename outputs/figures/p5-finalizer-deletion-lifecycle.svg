<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="684" viewBox="0 0 1000 684" role="img" aria-label="A client deletes an object, the API server sets the deletion timestamp and leaves it Terminating, the owning controller cleans up the external resource and removes its finalizer, and the API server then removes the object; three propagation modes are shown below."><title>How a finalizer delays object deletion</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="684" fill="#ffffff"/><rect x="20" y="20" width="960" height="570" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="40.0" y="56.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9c36b5" text-anchor="start"><tspan x="40.0" dy="0.0">Deletion of an object that carries a finalizer</tspan></text><rect x="40" y="100" width="120" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="100.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="100.0" dy="0.0">Client</tspan></text><rect x="250" y="100" width="160" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="330.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="330.0" dy="0.0">API server</tspan></text><rect x="530" y="100" width="150" height="80" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="605.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="605.0" dy="0.0">Object</tspan><tspan x="605.0" dy="20.0">Terminating</tspan></text><rect x="780" y="100" width="180" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="870.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="870.0" dy="0.0">Owning</tspan><tspan x="870.0" dy="20.0">controller</tspan></text><rect x="780" y="290" width="180" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="870.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="870.0" dy="0.0">External</tspan><tspan x="870.0" dy="20.0">resource</tspan></text><rect x="250" y="290" width="160" height="80" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="330.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="330.0" dy="0.0">Object</tspan><tspan x="330.0" dy="20.0">removed</tspan></text><polyline points="160.0,140.0 250.0,140.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="181.9" y="130.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="181.9" dy="0.0">delete</tspan></text><polyline points="410.0,140.0 530.0,140.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="416.1" y="108.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#099268" text-anchor="start"><tspan x="416.1" dy="0.0">sets timestamp</tspan></text><polyline points="680.0,140.0 780.0,140.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="703.0" y="108.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9c36b5" text-anchor="start"><tspan x="703.0" dy="0.0">sees it</tspan></text><polyline points="870.0,180.0 870.0,290.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="879.2" y="225.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="879.2" dy="0.0">clean up</tspan></text><polyline points="807.0,180.0 807.0,235.0 378.0,235.0 378.0,180.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="520.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="520.0" dy="0.0">remove finalizer</tspan></text><polyline points="282.0,180.0 282.0,290.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="188.5" y="225.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="188.5" dy="0.0">list empty</tspan></text><text x="40.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9c36b5" text-anchor="start"><tspan x="40.0" dy="0.0">Propagation modes decide timing for dependents</tspan></text><rect x="40" y="450" width="290" height="130" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="185.0" y="501.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="185.0" dy="0.0">Background</tspan><tspan x="185.0" dy="20.0">Owner removed at once;</tspan><tspan x="185.0" dy="20.0">dependents cleaned later</tspan></text><rect x="355" y="450" width="290" height="130" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="500.0" y="501.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">Foreground</tspan><tspan x="500.0" dy="20.0">Finalizer on owner waits for</tspan><tspan x="500.0" dy="20.0">blockOwnerDeletion dependents</tspan></text><rect x="670" y="450" width="290" height="130" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="815.0" y="501.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="815.0" dy="0.0">Orphan</tspan><tspan x="815.0" dy="20.0">Dependents are</tspan><tspan x="815.0" dy="20.0">left behind</tspan></text><rect x="20" y="610" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,642.0 100.0,642.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="112.0" y="646.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">delete or cleanup</tspan></text><polyline points="282.9,642.0 342.9,642.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="354.9" y="646.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="354.9" dy="0.0">written by API</tspan></text><polyline points="502.7,642.0 562.7,642.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="574.7" y="646.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="574.7" dy="0.0">watch</tspan></text><polyline points="653.2,642.0 713.2,642.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="725.2" y="646.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="725.2" dy="0.0">edit</tspan></text></svg>
