<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="684" viewBox="0 0 1000 684" role="img" aria-label="Two lanes show drift detection: in-cluster, Flux or Argo CD compare Git manifests with live objects and revert drift; for external infrastructure, a Crossplane provider controller compares the managed resource with the cloud API and Cluster API&#x27;s MachineHealthCheck replaces unhealthy Machines."><title>Two layers of drift detection</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="684" fill="#ffffff"/><rect x="20" y="20" width="960" height="250" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="32.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="32.0" dy="0.0">Layer 1: in-cluster objects</tspan></text><rect x="20" y="285" width="960" height="305" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="32.0" y="309.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="32.0" dy="0.0">Layer 2: external infrastructure</tspan></text><rect x="50" y="100" width="190" height="80" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="145.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="145.0" dy="0.0">Desired manifests</tspan><tspan x="145.0" dy="20.0">in Git</tspan></text><rect x="390" y="90" width="220" height="100" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="500.0" y="136.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">Flux or Argo CD</tspan><tspan x="500.0" dy="18.8">compare desired and live</tspan></text><rect x="760" y="100" width="190" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="855.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="855.0" dy="0.0">Live objects</tspan><tspan x="855.0" dy="20.0">in the cluster</tspan></text><rect x="340" y="198" width="320" height="46" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="500.0" y="217.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">Flux: dry-run apply</tspan><tspan x="500.0" dy="18.8">Argo CD: OutOfSync, re-sync</tspan></text><polyline points="240.0,140.0 390.0,140.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="264.9" y="112.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="264.9" dy="0.0">desired state</tspan></text><polyline points="610.0,140.0 760.0,140.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="638.8" y="112.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="638.8" dy="0.0">revert drift</tspan></text><rect x="50" y="345" width="190" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="145.0" y="381.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="145.0" dy="0.0">Managed resource</tspan><tspan x="145.0" dy="20.0">forProvider field</tspan></text><rect x="390" y="335" width="220" height="100" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="500.0" y="381.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">Crossplane provider</tspan><tspan x="500.0" dy="18.8">controller</tspan></text><rect x="760" y="345" width="190" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="855.0" y="371.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="855.0" dy="0.0">Cloud API</tspan><tspan x="855.0" dy="18.8">databases, buckets,</tspan><tspan x="855.0" dy="18.8">IAM</tspan></text><polyline points="240.0,385.0 390.0,385.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="257.2" y="357.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="257.2" dy="0.0">source of truth</tspan></text><polyline points="610.0,385.0 760.0,385.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="631.1" y="332.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="631.1" dy="0.0">revert console</tspan><tspan x="631.1" dy="17.5">edits</tspan></text><rect x="390" y="495" width="220" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="500.0" y="531.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">Cluster API</tspan><tspan x="500.0" dy="18.8">MachineHealthCheck</tspan></text><rect x="760" y="495" width="190" height="80" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="855.0" y="531.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="855.0" dy="0.0">Unhealthy</tspan><tspan x="855.0" dy="20.0">Machines</tspan></text><rect x="50" y="505" width="230" height="60" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="165.0" y="531.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="165.0" dy="0.0">Same loop,</tspan><tspan x="165.0" dy="18.8">for machines</tspan></text><polyline points="610.0,535.0 760.0,535.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="658.0" y="507.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="658.0" dy="0.0">replace</tspan></text><rect x="20" y="610" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,642.0 100.0,642.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="112.0" y="646.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">read desired state</tspan></text><polyline points="290.6,642.0 350.6,642.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="362.6" y="646.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="362.6" dy="0.0">correct drift</tspan></text><polyline points="502.7,642.0 562.7,642.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="574.7" y="646.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="574.7" dy="0.0">replace</tspan></text></svg>
