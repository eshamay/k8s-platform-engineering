<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Four stacked layers, from provider at the bottom through managed resources and composition to composite resource at the top, with Crossplane spanning all four and kro spanning the top two as one graph definition."><title>The four abstraction layers and who covers them</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="600" fill="#ffffff"/><rect x="20" y="20" width="960" height="560" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="60" y="60" width="440" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="280.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="280.0" dy="0.0">Composite resource</tspan><tspan x="280.0" dy="20.0">PostgreSQLInstance, WebApp</tspan></text><rect x="60" y="200" width="440" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="280.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="280.0" dy="0.0">Composition</tspan><tspan x="280.0" dy="20.0">maps high-level to low-level</tspan></text><rect x="60" y="340" width="440" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="280.0" y="366.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="280.0" dy="0.0">Managed resources</tspan><tspan x="280.0" dy="18.8">one object per external thing</tspan><tspan x="280.0" dy="18.8">e.g. VPC, IAM role</tspan></text><rect x="60" y="480" width="440" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="280.0" y="506.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="280.0" dy="0.0">Provider</tspan><tspan x="280.0" dy="18.8">controllers and CRDs</tspan><tspan x="280.0" dy="18.8">for one cloud or service</tspan></text><polyline points="280.0,140.0 280.0,200.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="315.4" y="160.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="315.4" dy="0.0">mapped by</tspan></text><polyline points="280.0,280.0 280.0,340.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="323.1" y="300.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="323.1" dy="0.0">maps to</tspan></text><polyline points="280.0,480.0 280.0,420.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="319.2" y="440.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="319.2" dy="0.0">delivers</tspan></text><rect x="530" y="60" width="14" height="500" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><rect x="570" y="60" width="14" height="220" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><rect x="620" y="110" width="300" height="120" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="770.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="770.0" dy="0.0">kro</tspan><tspan x="770.0" dy="20.0">composite + composition as one</tspan><tspan x="770.0" dy="20.0">graph definition</tspan></text><rect x="620" y="360" width="300" height="100" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="770.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="770.0" dy="0.0">Crossplane</tspan><tspan x="770.0" dy="20.0">all four layers</tspan></text></svg>
