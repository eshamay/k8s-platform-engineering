<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-label="Four columns compare deterministic names, a persisted external identity, recording intent then halting, and a server-side client token, each with an example, what it gives you and when it breaks."><title>Four ways to make an external create safe</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="570" fill="#ffffff"/><rect x="10" y="10" width="980" height="550" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="20" y="40" width="88" height="80" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="64.0" y="85.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="64.0" dy="0.0">Answer</tspan></text><rect x="20" y="170" width="88" height="80" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="64.0" y="215.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="64.0" dy="0.0">Example</tspan></text><rect x="20" y="300" width="88" height="80" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="64.0" y="336.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="64.0" dy="0.0">Gives</tspan><tspan x="64.0" dy="18.8">you</tspan></text><rect x="20" y="430" width="88" height="110" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="64.0" y="481.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="64.0" dy="0.0">Breaks</tspan><tspan x="64.0" dy="18.8">when</tspan></text><rect x="118" y="40" width="206" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="221.0" y="76.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="221.0" dy="0.0">Deterministic</tspan><tspan x="221.0" dy="18.8">names</tspan></text><rect x="118" y="170" width="206" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="221.0" y="196.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="221.0" dy="0.0">Config Connector</tspan><tspan x="221.0" dy="18.8">acquires;</tspan><tspan x="221.0" dy="18.8">ACK adopts by ID</tspan></text><rect x="118" y="300" width="206" height="80" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="221.0" y="336.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="221.0" dy="0.0">Same request names</tspan><tspan x="221.0" dy="18.8">same resource</tspan></text><rect x="118" y="430" width="206" height="110" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="221.0" y="481.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="221.0" dy="0.0">Cloud makes own IDs or</tspan><tspan x="221.0" dy="18.8">tolerates duplicates</tspan></text><rect x="334" y="40" width="206" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="437.0" y="76.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="437.0" dy="0.0">Persisted external</tspan><tspan x="437.0" dy="18.8">identity</tspan></text><rect x="334" y="170" width="206" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="437.0" y="196.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="437.0" dy="0.0">Crossplane</tspan><tspan x="437.0" dy="18.8">external-name</tspan><tspan x="437.0" dy="18.8">annotation</tspan></text><rect x="334" y="300" width="206" height="80" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="437.0" y="336.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="437.0" dy="0.0">Used for observe,</tspan><tspan x="437.0" dy="18.8">update, delete</tspan></text><rect x="334" y="430" width="206" height="110" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="437.0" y="481.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="437.0" dy="0.0">Crash before write:</tspan><tspan x="437.0" dy="18.8">nothing to find</tspan></text><rect x="550" y="40" width="206" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="653.0" y="76.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="653.0" dy="0.0">Record intent,</tspan><tspan x="653.0" dy="18.8">then halt</tspan></text><rect x="550" y="170" width="206" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="653.0" y="196.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="653.0" dy="0.0">Crossplane writes</tspan><tspan x="653.0" dy="18.8">external-create-pending</tspan><tspan x="653.0" dy="18.8">before create</tspan></text><rect x="550" y="300" width="206" height="80" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="653.0" y="336.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="653.0" dy="0.0">No leaked</tspan><tspan x="653.0" dy="18.8">duplicates</tspan></text><rect x="550" y="430" width="206" height="110" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="653.0" y="481.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="653.0" dy="0.0">Marker, no outcome:</tspan><tspan x="653.0" dy="18.8">needs a person</tspan></text><rect x="766" y="40" width="206" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="869.0" y="76.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="869.0" dy="0.0">Server-side</tspan><tspan x="869.0" dy="18.8">client token</tspan></text><rect x="766" y="170" width="206" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="869.0" y="206.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="869.0" dy="0.0">EC2 RunInstances</tspan><tspan x="869.0" dy="18.8">ClientToken</tspan></text><rect x="766" y="300" width="206" height="80" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="869.0" y="336.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="869.0" dy="0.0">Cloud deduplicates</tspan><tspan x="869.0" dy="18.8">(token stays stable)</tspan></text><rect x="766" y="430" width="206" height="110" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="869.0" y="481.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="869.0" dy="0.0">Exists only where the</tspan><tspan x="869.0" dy="18.8">provider built it</tspan></text></svg>
