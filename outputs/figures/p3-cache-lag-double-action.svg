<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="724" viewBox="0 0 1000 724" role="img" aria-label="Two rows compare a controller that creates a pod, reads a lagging informer cache and creates a second pod, against a controller that records an expectation and skips acting until the cache catches up."><title>How cache lag causes double action</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="724" fill="#ffffff"/><rect x="20" y="20" width="960" height="290" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="20" y="330" width="960" height="290" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="40.0" y="46.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="start"><tspan x="40.0" dy="0.0">Without bookkeeping</tspan></text><text x="40.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#099268" text-anchor="start"><tspan x="40.0" dy="0.0">With expectations</tspan></text><rect x="50" y="100" width="160" height="70" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="130.0" y="141.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">Controller</tspan></text><rect x="420" y="100" width="160" height="70" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="500.0" y="141.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">API server</tspan></text><rect x="790" y="100" width="160" height="70" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="870.0" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="870.0" dy="0.0">Informer cache</tspan><tspan x="870.0" dy="20.0">(still no pod)</tspan></text><rect x="50" y="235" width="160" height="70" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="130.0" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">Second pod</tspan><tspan x="130.0" dy="20.0">created</tspan></text><polyline points="210.0,135.0 420.0,135.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="276.5" y="125.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="276.5" dy="0.0">create pod</tspan></text><polyline points="580.0,135.0 790.0,135.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="611.9" y="125.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9c36b5" text-anchor="start"><tspan x="611.9" dy="0.0">watch, arrives late</tspan></text><polyline points="130.0,170.0 130.0,235.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="190.0" y="219.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="190.0" dy="0.0">create pod again</tspan></text><polyline points="870.0,100.0 870.0,68.0 130.0,68.0 130.0,100.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="330.0" y="59.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="330.0" dy="0.0">reconcile again: reads gap</tspan></text><rect x="50" y="410" width="160" height="70" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="130.0" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">Controller</tspan></text><rect x="420" y="410" width="160" height="70" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="500.0" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">API server</tspan></text><rect x="790" y="410" width="160" height="70" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="870.0" y="441.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="870.0" dy="0.0">Informer cache</tspan><tspan x="870.0" dy="20.0">(still no pod)</tspan></text><rect x="50" y="545" width="160" height="70" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="130.0" y="566.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">Expectations</tspan><tspan x="130.0" dy="18.8">(in-flight</tspan><tspan x="130.0" dy="18.8">creates)</tspan></text><rect x="450" y="550" width="220" height="60" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="560.0" y="576.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="560.0" dy="0.0">Skip until cache</tspan><tspan x="560.0" dy="20.0">catches up</tspan></text><polyline points="210.0,445.0 420.0,445.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="276.5" y="435.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="276.5" dy="0.0">create pod</tspan></text><polyline points="580.0,445.0 790.0,445.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="611.9" y="435.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9c36b5" text-anchor="start"><tspan x="611.9" dy="0.0">watch, arrives late</tspan></text><polyline points="870.0,410.0 870.0,378.0 130.0,378.0 130.0,410.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="330.0" y="369.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="330.0" dy="0.0">reconcile again: reads gap</tspan></text><polyline points="130.0,480.0 130.0,545.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="150.0" y="524.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="150.0" dy="0.0">record</tspan></text><polyline points="210.0,580.0 450.0,580.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="256.9" y="570.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="256.9" dy="0.0">cache not caught up</tspan></text><rect x="20" y="650" width="960" height="64" rx="1