<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="604" viewBox="0 0 1000 604" role="img" aria-label="A user deletes a managed resource, the object&#x27;s deletionTimestamp is noticed by the controller, which deletes the external resource and removes the finalizer so the object disappears, while a missing controller or credentials leaves the object stuck in Terminating."><title>Finalizer-guarded deletion of a managed resource</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="604" fill="#ffffff"/><rect x="20" y="20" width="960" height="480" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="110" width="150" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="115.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="115.0" dy="0.0">User</tspan></text><rect x="250" y="100" width="180" height="100" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="340.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="340.0" dy="0.0">Managed resource</tspan><tspan x="340.0" dy="20.0">has a finalizer</tspan></text><rect x="600" y="110" width="140" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="670.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="670.0" dy="0.0">Controller</tspan></text><rect x="840" y="110" width="120" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="900.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="900.0" dy="0.0">External</tspan><tspan x="900.0" dy="20.0">resource</tspan></text><rect x="40" y="360" width="170" height="80" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="125.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="125.0" dy="0.0">Object</tspan><tspan x="125.0" dy="20.0">disappears</tspan></text><rect x="250" y="360" width="190" height="80" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="345.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="345.0" dy="0.0">Stuck in</tspan><tspan x="345.0" dy="20.0">Terminating</tspan></text><polyline points="190.0,150.0 250.0,150.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="196.9" y="118.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="196.9" dy="0.0">delete</tspan></text><polyline points="430.0,150.0 600.0,150.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="449.6" y="118.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9c36b5" text-anchor="start"><tspan x="449.6" dy="0.0">deletionTimestamp</tspan></text><polyline points="740.0,150.0 840.0,150.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="766.9" y="118.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="766.9" dy="0.0">delete</tspan></text><polyline points="670.0,190.0 670.0,250.0 403.0,250.0 403.0,200.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="480.0" y="239.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#099268" text-anchor="start"><tspan x="480.0" dy="0.0">remove finalizer</tspan></text><polyline points="268.0,200.0 268.0,300.0 125.0,300.0 125.0,360.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="135.0" y="339.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="135.0" dy="0.0">finalizer removed</tspan></text><polyline points="340.0,200.0 345.0,360.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="355.0" y="339.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="355.0" dy="0.0">controller or credentials missing</tspan></text><rect x="20" y="530" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,562.0 100.0,562.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="112.0" y="566.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">deletion</tspan></text><polyline points="213.6,562.0 273.6,562.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="285.6" y="566.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="285.6" dy="0.0">controller notices</tspan></text><polyline points="464.2,562.0 524.2,562.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="536.2" y="566.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="536.2" dy="0.0">write to the object</tspan></text></svg>
