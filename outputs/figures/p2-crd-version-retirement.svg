<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="524" viewBox="0 0 1000 524" role="img" aria-label="A seven-step runbook in two rows: add the new version, migrate clients, stop serving the old version, create a storage version migration, wait for its Succeeded condition, check storedVersions, and only then remove the old version."><title>Retiring a CRD version step by step</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="524" fill="#ffffff"/><rect x="20" y="20" width="960" height="340" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="50" y="70" width="190" height="90" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="145.0" y="111.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="145.0" dy="0.0">1. Add new version</tspan><tspan x="145.0" dy="20.0">to the CRD</tspan></text><rect x="290" y="70" width="190" height="90" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="385.0" y="111.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="385.0" dy="0.0">2. Migrate clients</tspan><tspan x="385.0" dy="20.0">to the new version</tspan></text><rect x="530" y="70" width="190" height="90" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="625.0" y="111.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="625.0" dy="0.0">3. Stop serving</tspan><tspan x="625.0" dy="20.0">the old version</tspan></text><rect x="770" y="70" width="190" height="90" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="865.0" y="111.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="865.0" dy="0.0">4. Create storage</tspan><tspan x="865.0" dy="18.8">version migration</tspan></text><rect x="770" y="240" width="190" height="90" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="865.0" y="281.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="865.0" dy="0.0">5. Wait for</tspan><tspan x="865.0" dy="18.8">Succeeded condition</tspan></text><rect x="530" y="240" width="190" height="90" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="625.0" y="281.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="625.0" dy="0.0">6. Check</tspan><tspan x="625.0" dy="18.8">status.storedVersions</tspan></text><rect x="290" y="240" width="190" height="90" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="385.0" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="385.0" dy="0.0">7. Remove old</tspan><tspan x="385.0" dy="20.0">version from CRD</tspan></text><rect x="50" y="240" width="190" height="90" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="145.0" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="145.0" dy="0.0">Skip migration:</tspan><tspan x="145.0" dy="20.0">stranded objects</tspan></text><polyline points="240.0,115.0 290.0,115.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="480.0,115.0 530.0,115.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="720.0,115.0 770.0,115.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="865.0,160.0 865.0,240.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="770.0,285.0 720.0,285.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="530.0,285.0 480.0,285.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="240.0,285.0 290.0,285.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><rect x="20" y="450" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,482.0 100.0,482.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="112.0" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">next step</tspan></text><polyline points="221.3,482.0 281.3,482.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="293.3" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="293.3" dy="0.0">result of skipping migration</tspan></text></svg>
