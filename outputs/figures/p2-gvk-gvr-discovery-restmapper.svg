<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="534" viewBox="0 0 1000 534" role="img" aria-label="A manifest with a GVK is looked up in a RESTMapper built from a cached discovery snapshot, producing a GVR URL sent to the API server, while a CRD installed after the snapshot leads to a no-matches-for-kind failure."><title>How a manifest kind becomes a URL</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="534" fill="#ffffff"/><rect x="20" y="20" width="960" height="410" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="60" width="140" height="80" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="110.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="110.0" dy="0.0">Manifest</tspan><tspan x="110.0" dy="20.0">(GVK)</tspan></text><rect x="300" y="60" width="170" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="385.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="385.0" dy="0.0">RESTMapper</tspan><tspan x="385.0" dy="20.0">kind to resource</tspan></text><rect x="580" y="60" width="150" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="655.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="655.0" dy="0.0">REST URL</tspan><tspan x="655.0" dy="20.0">(GVR)</tspan></text><rect x="830" y="60" width="120" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="890.0" y="96.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="890.0" dy="0.0">API</tspan><tspan x="890.0" dy="18.8">server</tspan></text><rect x="40" y="250" width="160" height="70" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="120.0" y="281.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="120.0" dy="0.0">no matches</tspan><tspan x="120.0" dy="18.8">for kind</tspan></text><rect x="300" y="240" width="170" height="90" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="385.0" y="271.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="385.0" dy="0.0">Cached</tspan><tspan x="385.0" dy="20.0">discovery</tspan><tspan x="385.0" dy="20.0">snapshot</tspan></text><rect x="600" y="245" width="170" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="