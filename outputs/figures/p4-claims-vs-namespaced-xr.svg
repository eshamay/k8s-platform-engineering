<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="584" viewBox="0 0 1000 584" role="img" aria-label="Two side-by-side panels: in the claim model a claim in the tenant namespace references a separate cluster-scoped composite that composes resources, while in the namespaced model the composite and its composed resources all sit inside the tenant namespace."><title>Claims versus namespaced composites</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="584" fill="#ffffff"/><rect x="20" y="20" width="470" height="460" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="510" y="20" width="470" height="460" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="255.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#9c36b5" text-anchor="middle"><tspan x="255.0" dy="0.0">Claim model</tspan></text><text x="745.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#9c36b5" text-anchor="middle"><tspan x="745.0" dy="0.0">Namespaced composite</tspan></text><rect x="40" y="75" width="430" height="130" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="52.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" dy="0.0">Tenant namespace</tspan></text><rect x="150" y="120" width="210" height="65" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="255.0" y="148.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="255.0" dy="0.0">Claim</tspan><tspan x="255.0" dy="20.0">(developer creates)</tspan></text><rect x="150" y="270" width="210" height="65" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="255.0" y="298.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="255.0" dy="0.0">Composite</tspan><tspan x="255.0" dy="20.0">(cluster-scoped)</tspan></text><rect x="150" y="395" width="210" height="60" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="255.0" y="421.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="255.0" dy="0.0">Composed</tspan><tspan x="255.0" dy="20.0">resources</tspan></text><polyline points="202.5,185.0 202.5,270.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="118.0" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="118.0" dy="0.0">resourceRef</tspan></text><polyline points="307.5,270.0 307.5,185.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="318.0" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="318.0" dy="0.0">claimRef</tspan></text><polyline points="255.0,335.0 255.0,395.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="268.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="268.0" dy="0.0">composes</tspan></text><rect x="530" y="75" width="430" height="380" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="542.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="542.0" dy="0.0">Tenant namespace</tspan></text><rect x="640" y="140" width="210" height="70" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="745.0" y="171.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="745.0" dy="0.0">Composite</tspan><tspan x="745.0" dy="20.0">(developer creates)</tspan></text><rect x="640" y="330" width="210" height="70" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="745.0" y="361.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="745.0" dy="0.0">Composed</tspan><tspan x="745.0" dy="20.0">resources</tspan></text><polyline points="745.0,210.0 745.0,330.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="758.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="758.0" dy="0.0">composes</tspan></text><text x="745.0" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="middle"><tspan x="745.0" dy="0.0">Composite is the tenant boundary</tspan></text><rect x="20" y="510" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,542.0 100.0,542.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="112.0" y="546.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">reference between objects</tspan></text><polyline points="344.5,542.0 404.5,542.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="416.5" y="546.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="416.5" dy="0.0">composite creates children</tspan></text></svg>
