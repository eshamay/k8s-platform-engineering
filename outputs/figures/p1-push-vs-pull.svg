<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="584" viewBox="0 0 1000 584" role="img" aria-label="Side-by-side comparison: on the left a CI server outside three environments holds all their credentials and pushes to each; on the right an agent inside a cluster reads Git and writes to the cluster API with in-cluster identity."><title>Where push and pull delivery hold credentials</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="584" fill="#ffffff"/><rect x="20" y="20" width="470" height="470" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="510" y="20" width="470" height="470" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="40.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e8590c" text-anchor="start"><tspan x="40.0" dy="0.0">Push: actor runs outside the target</tspan></text><text x="530.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#099268" text-anchor="start"><tspan x="530.0" dy="0.0">Pull: agent runs in the target</tspan></text><rect x="140" y="140" width="220" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="250.0" y="176.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="250.0" dy="0.0">CI server</tspan><tspan x="250.0" dy="18.8">holds all credentials</tspan></text><rect x="40" y="360" width="130" height="60" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="105.0" y="395.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="105.0" dy="0.0">Environment A</tspan></text><rect x="185" y="360" width="130" height="60" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="250.0" y="395.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="250.0" dy="0.0">Environment B</tspan></text><rect x="330" y="360" width="130" height="60" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="395.0" y="395.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="395.0" dy="0.0">Environment C</tspan></text><rect x="60" y="435" width="380" height="40" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="250.0" y="460.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="250.0" dy="0.0">Compromised CI exposes all of them</tspan></text><rect x="595" y="70" width="140" height="60" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="665.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="665.0" dy="0.0">Git</tspan><tspan x="665.0" dy="20.0">repository</tspan></text><rect x="530" y="200" width="430" height="220" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="542.0" y="224.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="542.0" dy="0.0">Target cluster</tspan></text><rect x="600" y="270" width="130" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="665.0" y="315.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="665.0" dy="0.0">Pull agent</tspan></text><rect x="820" y="270" width="130" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="885.0" y="315.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="885.0" dy="0.0">Cluster API</tspan></text><rect x="560" y="435" width="380" height="40" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="750.0" y="460.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="750.0" dy="0.0">Agent uses in-cluster identity</tspan></text><polyline points="250.0,220.0 105.0,360.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><polyline points="250.0,220.0 250.0,360.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><polyline points="250.0,220.0 395.0,360.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><polyline points="665.0,270.0 665.0,130.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="692.6" y="176.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="692.6" dy="0.0">read access</tspan></text><polyline points="730.0,310.0 820.0,310.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="736.5" y="247.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="736.5" dy="0.0">in-cluster</tspan><tspan x="736.5" dy="17.5">identity</tspan></text><rect x="20" y="510" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,542.0 100.0,542.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="112.0" y="546.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">write to target</tspan></text><polyline points="267.5,542.0 327.5,542.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="339.5" y="546.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="339.5" dy="0.0">read desired state</tspan></text></svg>
