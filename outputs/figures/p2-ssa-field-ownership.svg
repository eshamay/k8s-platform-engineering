<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="659" viewBox="0 0 1000 659" role="img" aria-label="Flux kustomize-controller, an autoscaler and kubectl each send partial intent to the API server, which merges it into one live object and records per-field owners in managedFields; a differing value from a second manager raises a conflict the applier resolves by forcing, dropping the field or matching the value."><title>Server-side apply and field ownership</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="659" fill="#ffffff"/><rect x="30" y="80" width="200" height="70" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="130.0" y="111.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">Flux</tspan><tspan x="130.0" dy="20.0">kustomize-controller</tspan></text><rect x="30" y="190" width="200" height="70" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="130.0" y="221.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">Autoscaler</tspan><tspan x="130.0" dy="20.0">(HPA)</tspan></text><rect x="30" y="300" width="200" height="70" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="130.0" y="341.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" dy="0.0">kubectl</tspan></text><rect x="340" y="130" width="170" height="190" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="425.0" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="425.0" dy="0.0">API server</tspan><tspan x="425.0" dy="20.0">merges partial</tspan><tspan x="425.0" dy="20.0">intents</tspan></text><rect x="610" y="50" width="360" height="340" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="622.0" y="74.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="622.0" dy="0.0">Live object: managedFields</tspan></text><rect x="630" y="110" width="320" height="100" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="790.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="790.0" dy="0.0">kustomize-controller</tspan><tspan x="790.0" dy="20.0">Apply: owns image</tspan></text><rect x="630" y="240" width="320" height="120" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="790.0" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="790.0" dy="0.0">kube-controller-manager</tspan><tspan x="790.0" dy="20.0">Update: owns replicas</tspan><tspan x="790.0" dy="20.0">(HPA scales via scale subresource)</tspan></text><rect x="340" y="440" width="170" height="80" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="425.0" y="466.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="425.0" dy="0.0">Conflict error</tspan><tspan x="425.0" dy="20.0">returned</tspan><tspan x="425.0" dy="20.0">to later applier</tspan></text><rect x="590" y="420" width="390" height="130" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="602.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="602.0" dy="0.0">Applier chooses</tspan></text><rect x="600" y="460" width="120" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="660.0" y="496.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="660.0" dy="0.0">Force</tspan><tspan x="660.0" dy="18.8">sole owner</tspan></text><rect x="730" y="460" width="120" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="790.0" y="496.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="790.0" dy="0.0">Drop field</tspan><tspan x="790.0" dy="18.8">give up</tspan></text><rect x="860" y="460" width="110" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="915.0" y="496.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="915.0" dy="0.0">Same value</tspan><tspan x="915.0" dy="18.8">co-owner</tspan></text><polyline points="230.0,115.0 340.0,168.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><polyline points="230.0,225.0 340.0,225.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><polyline points="230.0,335.0 340.0,282.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><polyline points="510.0,225.0 610.0,220.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><polyline points="425.0,320.0 425.0,440.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="427.2" y="370.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="427.2" dy="0.0">different value</tspan></text><polyline points="510.0,480.0 590.0,485.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><rect x="20" y="585" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,617.0 100.0,617.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="112.0" y="621.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">partial intent</tspan></text><polyline points="259.8,617.0 319.8,617.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="331.8" y="621.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="331.8" dy="0.0">merge and record</tspan></text><polyline points="495.0,617.0 555.0,617.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="567.0" y="621.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="567.0" dy="0.0">conflict path</tspan></text></svg>
