<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Six stages in order: a timed-out downstream call, client retries, a DNS query spike, search-path multiplication of each lookup, DNS pods running out of memory and being killed together, and in-cluster monitoring going blind"><title>A retry storm cascades into a DNS outage</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="420" fill="#ffffff"/><rect x="20" y="20" width="960" height="380" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="50" y="80" width="230" height="90" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="165.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="165.0" dy="0.0">Downstream call</tspan><tspan x="165.0" dy="20.0">times out</tspan></text><rect x="385" y="80" width="230" height="90" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="500.0" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">Clients retry</tspan></text><rect x="720" y="80" width="230" height="90" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="835.0" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="835.0" dy="0.0">DNS queries spike</tspan></text><rect x="50" y="270" width="230" height="100" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="165.0" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="165.0" dy="0.0">Search path multiplies</tspan><tspan x="165.0" dy="20.0">each external lookup</tspan></text><rect x="385" y="270" width="230" height="100" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="500.0" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">DNS pods out of memory</tspan><tspan x="500.0" dy="20.0">and killed together</tspan></text><rect x="720" y="270" width="230" height="100" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="835.0" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="835.0" dy="0.0">In-cluster monitoring</tspan><tspan x="835.0" dy="20.0">goes blind</tspan></text><polyline points="280.0,125.0 385.0,125.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="615.0,125.0 720.0,125.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="835.0,170.0 835.0,210.0 165.0,210.0 165.0,270.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="280.0,320.0 385.0,320.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="615.0,320.0 720.0,320.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/></svg>
