ke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="574.7" y="476.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="574.7" dy="0.0">read</tspan></text><polyline points="645.5,472.0 705.5,472.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="717.5" y="476.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="717.5" dy="0.0">write back</tspan></text></svg>
