<svg xmlns="http://www.w3.org/2000/svg" width="960" height="514" viewBox="0 0 960 514" role="img" aria-label="A watch streams changes from the API server into an informer cache, which enqueues deduplicated object keys on a work queue; the reconciler takes a key, reads full state from the API server and writes status back."><title>Events are hints, state is truth</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="960" height="514" fill="#ffffff"/><rect x="20" y="20" width="920" height="390" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="40" y="120" width="150" height="90" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="115.0" y="161.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="115.0" dy="0.0">API server</tspan><tspan x="115.0" dy="20.0">(full state)</tspan></text><rect x="270" y="120" width="150" height="90" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="345.0" y="161.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="345.0" dy="0.0">Informer cache</tspan><tspan x="345.0" dy="20.0">(client side)</tspan></text><rect x="500" y="120" width="150" height="90" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="575.0" y="151.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="575.0" dy="0.0">Work queue</tspan><tspan x="575.0" dy="20.0">(deduplicated</tspan><tspan x="575.0" dy="20.0">keys)</tspan></text><rect x="750" y="120" width="170" height="90" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="835.0" y="151.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="835.0" dy="0.0">Reconciler</tspan><tspan x="835.0" dy="20.0">(enforces all</tspan><tspan x="835.0" dy="20.0">state)</tspan></text><polyline points="190.0,165.0 270.0,165.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="210.8" y="155.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9c36b5" text-anchor="start"><tspan x="210.8" dy="0.0">watch</tspan></text><polyline points="420.0,165.0 500.0,165.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="433.1" y="155.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="433.1" dy="0.0">enqueue</tspan></text><polyline points="650.0,165.0 750.0,165.0" fill="none" stroke="#343a4