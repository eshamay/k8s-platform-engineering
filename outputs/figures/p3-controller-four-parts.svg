<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="564" viewBox="0 0 1000 564" role="img" aria-label="A controller reads the spec of an object, observes current state from other objects or an external API, acts on the difference, and writes its observations to the status of the same object."><title>The four parts of a controller</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="564" fill="#ffffff"/><rect x="20" y="20" width="400" height="230" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="32.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="32.0" dy="0.0">Object in the API</tspan></text><rect x="50" y="70" width="340" height="70" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="220.0" y="101.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="220.0" dy="0.0">spec</tspan><tspan x="220.0" dy="20.0">intent, owned by users</tspan></text><rect x="50" y="160" width="340" height="70" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="220.0" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="220.0" dy="0.0">status</tspan><tspan x="220.0" dy="20.0">observation, owned by controller</tspan></text><rect x="620" y="70" width="240" height="160" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="740.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="740.0" dy="0.0">Controller</tspan><tspan x="740.0" dy="20.0">compute difference,</tspan><tspan x="740.0" dy="20.0">then act</tspan></text><rect x="620" y="340" width="240" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="740.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="740.0" dy="0.0">Current state</tspan><tspan x="740.0" dy="20.0">other objects or</tspan><tspan x="740.0" dy="20.0">external API</tspan></text><text x="20.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="20.0" dy="0.0">Separate /status subresource with its own permissions</tspan></text><text x="20.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="20.0" dy="0.0">so re-applying a manifest cannot overwrite status</tspan></text><polyline points="390.0,105.0 620.0,102.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="458.8" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="458.8" dy="0.0">read desired</tspan></text><polyline points="740.0,340.0 740.0,230.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="749.0" y="275.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="749.0" dy="0.0">observe</tspan></text><polyline points="620.0,195.0 390.0,195.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="424.1" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#099268" text-anchor="start"><tspan x="424.1" dy="0.0">write what it learned</tspan></text><rect x="20" y="490" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,522.0 100.0,522.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="112.0" y="526.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">read</tspan></text><polyline points="182.8,522.0 242.8,522.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="254.8" y="526.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="254.8" dy="0.0">write back status</tspan></text></svg>
