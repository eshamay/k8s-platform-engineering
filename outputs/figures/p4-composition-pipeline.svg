<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="664" viewBox="0 0 1000 664" role="img" aria-label="Crossplane reads a composite resource, calls each composition function pod in order over gRPC, passes the desired state from one step to the next, and applies the result to the API server."><title>A Composition as a pipeline of functions</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="664" fill="#ffffff"/><rect x="30" y="60" width="150" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="105.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="105.0" dy="0.0">Composite</tspan><tspan x="105.0" dy="20.0">resource (XR)</tspan></text><rect x="30" y="220" width="150" height="90" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="105.0" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="105.0" dy="0.0">Crossplane</tspan><tspan x="105.0" dy="20.0">controller</tspan></text><rect x="30" y="460" width="150" height="70" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="105.0" y="501.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="105.0" dy="0.0">API server</tspan></text><rect x="370" y="130" width="600" height="230" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="382.0" y="153.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="382.0" dy="0.0">Composition pipeline: function pods</tspan></text><rect x="400" y="230" width="140" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="470.0" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="470.0" dy="0.0">Step 1</tspan><tspan x="470.0" dy="20.0">function pod</tspan></text><rect x="610" y="230" width="140" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="680.0" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="680.0" dy="0.0">Step 2</tspan><tspan x="680.0" dy="20.0">function pod</tspan></text><rect x="800" y="230" width="140" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2" stroke-dasharray="8 6"/><text x="870.0" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="870.0" dy="0.0">More steps</tspan><tspan x="870.0" dy="20.0">in order</tspan></text><rect x="370" y="440" width="600" height="110" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="670.0" y="481.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="670.0" dy="0.0">Each call carries</tspan><tspan x="670.0" dy="18.8">XR state, observed state of owned resources,</tspan><tspan x="670.0" dy="18.8">accumulated desired state, input, context</tspan></text><polyline points="105.0,220.0 105.0,140.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="215.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="215.0" dy="0.0">reads each reconcile</tspan></text><polyline points="180.0,247.0 400.0,270.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="190.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="190.0" dy="0.0">gRPC call, in order</tspan></text><polyline points="540.0,270.0 610.0,270.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="520.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="520.0" dy="0.0">desired state passed on</tspan></text><polyline points="750.0,270.0 800.0,270.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="870.0,310.0 870.0,395.0 230.0,395.0 230.0,297.0 180.0,296.5" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="560.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="560.0" dy="0.0">final desired state</tspan></text><polyline points="105.0,310.0 105.0,460.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="130.5" y="375.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2" text-anchor="start"><tspan x="130.5" dy="0.0">apply result</tspan></text><rect x="20" y="590" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,622.0 100.0,622.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="112.0" y="627.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">reads</tspan></text><polyline points="193.2,622.0 253.2,622.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="265.2" y="627.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="265.2" dy="0.0">call and hand-off</tspan></text><polyline points="445.5,622.0 505.5,622.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="517.5" y="627.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="517.5" dy="0.0">write</tspan></text></svg>
