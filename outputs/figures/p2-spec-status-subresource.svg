" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,552.0 100.0,552.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="112.0" y="557.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">writes intent</tspan></text><polyline points="259.2,552.0 319.2,552.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="331.2" y="557.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="331.2" dy="0.0">writes observations</tspan></text><polyline points="528.0,552.0 588.0,552.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="600.0" y="557.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="600.0" dy="0.0">bumps on change</tspan></text></svg>
