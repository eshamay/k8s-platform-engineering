<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="594" viewBox="0 0 1000 594" role="img" aria-label="Users and GitOps tools write through the main endpoint into the spec of one object, which bumps metadata.generation, while controllers write through the /status endpoint into the status of the same object."><title>Spec and status written through separate endpoints</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="594" fill="#ffffff"/><rect x="20" y="20" width="960" height="480" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="690" y="60" width="270" height="420" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="702.0" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="702.0" dy="0.0">One object</tspan></text><rect x="50" y="120" width="170" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="135.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="135.0" dy="0.0">Users and</tspan><tspan x="135.0" dy="20.0">GitOps tools</tspan></text><rect x="50" y="340" width="170" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="135.0" y="386.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="135.0" dy="0.0">Controllers</tspan></text><rect x="320" y="120" width="190" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="415.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="415.0" dy="0.0">Main endpoint</tspan><tspan x="415.0" dy="20.0">ignores status</tspan></text><rect x="320" y="340" width="190" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="415.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="415.0" dy="0.0">/status endpoint</tspan><tspan x="415.0" dy="20.0">ignores all but</tspan><tspan x="415.0" dy="20.0">status</tspan></text><rect x="730" y="120" width="200" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="830.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="830.0" dy="0.0">spec</tspan><tspan x="830.0" dy="20.0">intent</tspan></text><rect x="730" y="258" width="200" height="50" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="830.0" 