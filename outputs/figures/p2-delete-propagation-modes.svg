<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="664" viewBox="0 0 1000 664" role="img" aria-label="Three side-by-side panels compare cascade deletion: background deletes the owner at once and the garbage collector removes dependents afterward in no guaranteed order, foreground keeps the owner visible until blocking dependents are gone, and orphan strips owner references so dependents survive."><title>Background, foreground and orphan deletion compared</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="664" fill="#ffffff"/><rect x="20" y="20" width="280" height="500" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="315" y="20" width="370" height="500" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><rect x="700" y="20" width="280" height="500" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="160.0" y="52.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="middle"><tspan x="160.0" dy="0.0">Background</tspan></text><text x="500.0" y="52.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="middle"><tspan x="500.0" dy="0.0">Foreground</tspan></text><text x="840.0" y="52.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#495057" text-anchor="middle"><tspan x="840.0" dy="0.0">Orphan</tspan></text><rect x="30" y="80" width="260" height="80" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="160.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="160.0" dy="0.0">Owner</tspan><tspan x="160.0" dy="20.0">deleted immediately</tspan></text><rect x="30" y="210" width="260" height="60" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="160.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="160.0" dy="0.0">Garbage collector</tspan></text><rect x="30" y="330" width="125" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="92.5" y="376.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="92.5" dy="0.0">Dependent</tspan></text><rect x="165" y="330" width="125" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="227.5" y="376.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="227.5" dy="0.0">Dependent</tspan></text><rect x="30" y="440" width="260" height="60" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="160.0" y="466.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="160.0" dy="0.0">Dependents go afterward,</tspan><tspan x="160.0" dy="18.8">no guaranteed order</tspan></text><rect x="330" y="80" width="340" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="500.0" y="116.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">Owner stays visible</tspan><tspan x="500.0" dy="18.8">foregroundDeletion finalizer</tspan></text><rect x="330" y="210" width="340" height="60" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="500.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">Garbage collector</tspan></text><rect x="330" y="330" width="165" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="412.5" y="366.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="412.5" dy="0.0">Dependent</tspan><tspan x="412.5" dy="18.8">blockOwnerDeletion</tspan></text><rect x="505" y="330" width="165" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="587.5" y="366.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="587.5" dy="0.0">Dependent</tspan><tspan x="587.5" dy="18.8">blockOwnerDeletion</tspan></text><rect x="330" y="440" width="340" height="60" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="500.0" y="466.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="500.0" dy="0.0">Owner goes last; hangs if</tspan><tspan x="500.0" dy="18.8">one cannot be deleted</tspan></text><rect x="710" y="80" width="260" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="840.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="840.0" dy="0.0">Owner</tspan><tspan x="840.0" dy="20.0">orphan finalizer</tspan></text><rect x="710" y="330" width="125" height="80" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="772.5" y="366.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="772.5" dy="0.0">Dependent</tspan><tspan x="772.5" dy="18.8">survives</tspan></text><rect x="845" y="330" width="125" height="80" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="907.5" y="366.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="907.5" dy="0.0">Dependent</tspan><tspan x="907.5" dy="18.8">survives</tspan></text><rect x="710" y="440" width="260" height="60" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="840.0" y="466.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="840.0" dy="0.0">Empty ownerReferences</tspan><tspan x="840.0" dy="18.8">until someone deletes them</tspan></text><polyline points="160.0,160.0 160.0,210.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="160.0,270.0 92.5,330.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><polyline points="160.0,270.0 227.5,330.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><polyline points="500.0,270.0 412.5,330.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><polyline points="500.0,270.0 587.5,330.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><polyline points="840.0,160.0 772.5,330.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="717.7" y="235.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="717.7" dy="0.0">strips owner references</tspan></text><polyline points="840.0,160.0 907.5,330.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><rect x="20" y="590" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,622.0 100.0,622.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="112.0" y="626.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">owner deletion handed on</tspan></text><polyline points="336.8,622.0 396.8,622.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="408.8" y="626.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="408.8" dy="0.0">garbage collector deletes</tspan></text><polyline points="641.3,622.0 701.3,622.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="713.3" y="626.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="713.3" dy="0.0">owner references stripped</tspan></text></svg>
