<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="564" viewBox="0 0 1000 564" role="img" aria-label="Git feeds GitOps controllers that apply into the Kubernetes API, which domain controllers watch and reconcile into external reality, with four pitfall seams listed below: custom-resource health, pruning, drift against mutating controllers, and credentials."><title>The two-layer loop and its seams</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="564" fill="#ffffff"/><rect x="20" y="20" width="960" height="440" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="200.0" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9c36b5" text-anchor="middle"><tspan x="200.0" dy="0.0">Layer 1: Git into the API</tspan></text><text x="685.0" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9c36b5" text-anchor="middle"><tspan x="685.0" dy="0.0">Layer 2: the API into reality</tspan></text><rect x="40" y="120" width="120" height="80" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="100.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="100.0" dy="0.0">Git</tspan><tspan x="100.0" dy="20.0">repository</tspan></text><rect x="220" y="120" width="140" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="290.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="290.0" dy="0.0">GitOps</tspan><tspan x="290.0" dy="20.0">controllers</tspan></text><rect x="420" y="100" width="150" height="120" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="495.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="495.0" dy="0.0">Kubernetes API</tspan><tspan x="495.0" dy="20.0">(desired</tspan><tspan x="495.0" dy="20.0">state)</tspan></text><rect x="630" y="120" width="130" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="695.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="695.0" dy="0.0">Domain</tspan><tspan x="695.0" dy="20.0">controllers</tspan></text><rect x="830" y="120" width="120" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="890.0" y="156.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="890.0" dy="0.0">External</tspan><tspan x="890.0" dy="18.8">reality</tspan></text><polyline points="160.0,160.0 220.0,160.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="170.8" y="150.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="170.8" dy="0.0">fetch</tspan></text><polyline points="360.0,160.0 420.0,160.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="370.8" y="150.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="370.8" dy="0.0">apply</tspan></text><polyline points="570.0,160.0 630.0,160.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="580.8" y="150.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9c36b5" text-anchor="start"><tspan x="580.8" dy="0.0">watch</tspan></text><polyline points="760.0,160.0 830.0,160.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="760.4" y="150.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="760.4" dy="0.0">reconcile</tspan></text><text x="40.0" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start"><tspan x="40.0" dy="0.0">Each layer is level-triggered. The pitfalls mostly occur at the seams between them:</tspan></text><rect x="50" y="320" width="205" height="90" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="152.5" y="361.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="152.5" dy="0.0">Custom-resource</tspan><tspan x="152.5" dy="20.0">health</tspan></text><rect x="280" y="320" width="205" height="90" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="382.5" y="371.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="382.5" dy="0.0">Pruning</tspan></text><rect x="500" y="320" width="225" height="90" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="612.5" y="361.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="612.5" dy="0.0">Drift against</tspan><tspan x="612.5" dy="20.0">mutating controllers</tspan></text><rect x="745" y="320" width="205" height="90" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="847.5" y="371.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="847.5" dy="0.0">Credentials</tspan></text><rect x="20" y="490" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,522.0 100.0,522.0" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="112.0" y="526.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">fetch</tspan></text><polyline points="190.5,522.0 250.5,522.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="262.5" y="526.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="262.5" dy="0.0">apply to the API</tspan></text><polyline points="425.7,522.0 485.7,522.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="497.7" y="526.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="497.7" dy="0.0">watch for changes</tspan></text></svg>
