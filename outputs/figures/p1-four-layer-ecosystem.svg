<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="704" viewBox="0 0 1000 704" role="img" aria-label="Four stacked layers from top to bottom: delivery (Flux, Argo CD), composition (Crossplane, kro), provider controllers (ACK, Config Connector, Azure Service Operator, Cluster API) and primitives; Git feeds the delivery layer and the provider controllers call external cloud APIs."><title>Four layers of the Kubernetes ecosystem</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="704" fill="#ffffff"/><rect x="250" y="15" width="480" height="570" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="262.0" y="39.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="262.0" dy="0.0">Kubernetes API server</tspan></text><rect x="20" y="80" width="100" height="80" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="70.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="70.0" dy="0.0">Git</tspan><tspan x="70.0" dy="20.0">repository</tspan></text><rect x="280" y="70" width="420" height="100" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="490.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="490.0" dy="0.0">Delivery</tspan><tspan x="490.0" dy="20.0">Flux, Argo CD</tspan></text><rect x="280" y="225" width="420" height="100" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="490.0" y="271.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="490.0" dy="0.0">Composition</tspan><tspan x="490.0" dy="20.0">Crossplane, kro</tspan></text><rect x="280" y="380" width="420" height="100" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="490.0" y="416.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="490.0" dy="0.0">Provider controllers</tspan><tspan x="490.0" dy="18.8">ACK, Config Connector,</tspan><tspan x="490.0" dy="18.8">Azure Service Operator, Cluster API</tspan></text><rect x="280" y="505" width="420" height="60" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="490.0" y="531.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="490.0" dy="0.0">Primitives</tspan><tspan x="490.0" dy="18.8">Controllers, CRDs, operator pattern</tspan></text><rect x="880" y="395" width="100" height="70" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="930.0" y="416.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="930.0" dy="0.0">External</tspan><tspan x="930.0" dy="20.0">cloud</tspan><tspan x="930.0" dy="20.0">APIs</tspan></text><polyline points="120.0,120.0 280.0,120.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="121.9" y="90.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="121.9" dy="0.0">desired state</tspan></text><polyline points="490.0,170.0 490.0,225.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="511.5" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="511.5" dy="0.0">reconciles</tspan></text><polyline points="490.0,325.0 490.0,380.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="500.3" y="343.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="500.3" dy="0.0">expands into resources</tspan></text><polyline points="700.0,430.0 880.0,430.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="736.1" y="400.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="736.1" dy="0.0">direct control</tspan></text><rect x="20" y="630" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,662.0 100.0,662.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="112.0" y="666.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">desired state from Git</tspan></text><polyline points="321.4,662.0 381.4,662.0" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="393.4" y="666.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="393.4" dy="0.0">act on a resource or external system</tspan></text></svg>
