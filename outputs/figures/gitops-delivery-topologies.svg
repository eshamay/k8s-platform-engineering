<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1250" viewBox="0 0 1640 1250" role="img" aria-label="Four GitOps delivery topologies: Argo CD hub applying to remote clusters, argocd-agent agents connecting out to a hub, Flux controllers in every cluster, and a Flux Kustomization targeting a remote cluster"><title>Where the delivery agent runs</title><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker></defs><rect width="1640" height="1250" fill="#ffffff"/><text x="40.0" y="54.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" dy="0.0">Where the delivery agent runs</tspan></text><text x="40.0" y="82.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start"><tspan x="40.0" dy="0.0">Four ways a GitOps agent reaches the clusters it manages. Arrowheads point away from whichever side starts the connection.</tspan></text><rect x="40" y="110" width="760" height="470" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="60.0" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" dy="0.0">A. Argo CD: a central hub applies to remote clusters</tspan></text><rect x="840" y="110" width="760" height="470" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="860.0" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="860.0" dy="0.0">B. argocd-agent: agents reach back to the hub</tspan></text><rect x="40" y="620" width="760" height="470" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="60.0" y="654.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" dy="0.0">C. Flux: controllers run in every cluster</tspan></text><rect x="840" y="620" width="760" height="470" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text x="860.0" y="654.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="860.0" dy="0.0">D. Flux: a Kustomization targets another cluster</tspan></text><rect x="64" y="300" width="120" height="70" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="124.0" y="331.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="124.0" dy="0.0">Git</tspan><tspan x="124.0" dy="20.0">repository</tspan></text><rect x="290" y="260" width="180" height="150" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="380.0" y="331.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="380.0" dy="0.0">Argo CD</tspan><tspan x="380.0" dy="20.0">(hub cluster)</tspan></text><rect x="580" y="200" width="190" height="70" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="675.0" y="241.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="675.0" dy="0.0">Remote cluster 1</tspan></text><rect x="580" y="315" width="190" height="70" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="675.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="675.0" dy="0.0">Remote cluster 2</tspan></text><rect x="580" y="430" width="190" height="70" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="675.0" y="471.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="675.0" dy="0.0">Remote cluster 3</tspan></text><line x1="184" y1="335" x2="290" y2="335" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="188.0" y="324.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="188.0" dy="0.0">pull source</tspan></text><line x1="470" y1="305" x2="580" y2="235" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><line x1="470" y1="335" x2="580" y2="350" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><line x1="470" y1="365" x2="580" y2="465" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="480.0" y="325.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="480.0" dy="0.0">apply (push)</tspan></text><text x="70.0" y="515.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="70.0" dy="0.0">Every Application pulls its source from Git, but the fleet</tspan><tspan x="70.0" dy="18.8">is reached by a push from the hub into each registered cluster.</tspan></text><rect x="870" y="260" width="190" height="150" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="965.0" y="331.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="965.0" dy="0.0">Control-plane hub</tspan><tspan x="965.0" dy="20.0">(central)</tspan></text><rect x="1310" y="190" width="260" height="100" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="1324.0" y="213.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#099268" text-anchor="start"><tspan x="1324.0" dy="0.0">Cluster 1</tspan></text><rect x="1330" y="230" width="120" height="48" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="1390.0" y="260.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1390.0" dy="0.0">agent</tspan></text><line x1="1330" y1="254" x2="1060" y2="305" stroke="#e8590c" stroke-width="3" marker-end="url(#m-orange)"/><rect x="1310" y="305" width="260" height="100" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="1324.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#099268" text-anchor="start"><tspan x="1324.0" dy="0.0">Cluster 2</tspan></text><rect x="1330" y="345" width="120" height="48" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="1390.0" y="375.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1390.0" dy="0.0">agent</tspan></text><line x1="1330" y1="369" x2="1060" y2="335" stroke="#e8590c" stroke-width="3" marker-end="url(#m-orange)"/><rect x="1310" y="420" width="260" height="100" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="1324.0" y="443.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#099268" text-anchor="start"><tspan x="1324.0" dy="0.0">Cluster 3</tspan></text><rect x="1330" y="460" width="120" height="48" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="1390.0" y="490.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1390.0" dy="0.0">agent</tspan></text><line x1="1330" y1="484" x2="1060" y2="365" stroke="#e8590c" stroke-width="3" marker-end="url(#m-orange)"/><text x="1090.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e8590c" text-anchor="start"><tspan x="1090.0" dy="0.0">agent connects</tspan><tspan x="1090.0" dy="17.5">out to the hub</tspan></text><text x="870.0" y="515.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="870.0" dy="0.0">Each cluster initiates the connection; the hub needs no</tspan><tspan x="870.0" dy="18.8">inbound path into the clusters it coordinates.</tspan></text><rect x="330" y="690" width="180" height="60" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="420.0" y="726.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420.0" dy="0.0">Git repository</tspan></text><rect x="70" y="850" width="220" height="150" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="84.0" y="873.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#099268" text-anchor="start"><tspan x="84.0" dy="0.0">Cluster 1</tspan></text><rect x="95" y="900" width="170" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="180.0" y="926.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="180.0" dy="0.0">source</tspan><tspan x="180.0" dy="18.8">kustomize</tspan><tspan x="180.0" dy="18.8">helm</tspan></text><line x1="180" y1="900" x2="360" y2="750" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><rect x="310" y="850" width="220" height="150" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="324.0" y="873.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#099268" text-anchor="start"><tspan x="324.0" dy="0.0">Cluster 2</tspan></text><rect x="335" y="900" width="170" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="420.0" y="926.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="420.0" dy="0.0">source</tspan><tspan x="420.0" dy="18.8">kustomize</tspan><tspan x="420.0" dy="18.8">helm</tspan></text><line x1="395" y1="900" x2="420" y2="750" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><rect x="550" y="850" width="220" height="150" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="564.0" y="873.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#099268" text-anchor="start"><tspan x="564.0" dy="0.0">Cluster 3</tspan></text><rect x="575" y="900" width="170" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="660.0" y="926.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="660.0" dy="0.0">source</tspan><tspan x="660.0" dy="18.8">kustomize</tspan><tspan x="660.0" dy="18.8">helm</tspan></text><line x1="690" y1="900" x2="480" y2="750" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="80.0" y="1035.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="80.0" dy="0.0">Each cluster runs its own set of controllers and pulls from Git</tspan><tspan x="80.0" dy="18.8">itself; no central component reaches into the clusters.</tspan></text><text x="218.0" y="830.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="218.0" dy="0.0">pull</tspan></text><rect x="870" y="690" width="130" height="60" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="935.0" y="716.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="935.0" dy="0.0">Git</tspan><tspan x="935.0" dy="18.8">repository</tspan></text><rect x="870" y="770" width="340" height="230" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="1040.0" y="793.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#099268" text-anchor="start"><tspan x="1040.0" dy="0.0">Management cluster</tspan></text><rect x="890" y="815" width="300" height="60" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="1040.0" y="851.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1040.0" dy="0.0">Flux controllers</tspan></text><rect x="890" y="905" width="300" height="70" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="3"/><text x="1040.0" y="936.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1040.0" dy="0.0">Kustomization</tspan><tspan x="1040.0" dy="20.0">.spec.kubeConfig</tspan></text><rect x="1360" y="835" width="210" height="150" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="1465.0" y="916.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1465.0" dy="0.0">Remote cluster</tspan></text><line x1="935" y1="750" x2="935" y2="815" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="945.0" y="765.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="945.0" dy="0.0">pull</tspan></text><line x1="1190" y1="940" x2="1360" y2="910" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="1225.0" y="872.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="1225.0" dy="0.0">apply into</tspan><tspan x="1225.0" dy="17.5">the remote</tspan><tspan x="1225.0" dy="17.5">cluster</tspan></text><text x="870.0" y="1025.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="870.0" dy="0.0">The Kustomization reaches a remote cluster through its kubeConfig</tspan><tspan x="870.0" dy="18.8">reference, which is best configured without a stored secret.</tspan></text><rect x="40" y="1125" width="1560" height="90" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="60.0" y="1150.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" dy="0.0">How to read the arrows</tspan></text><line x1="60" y1="1183" x2="130" y2="1183" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-gray)"/><text x="144.0" y="1188.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="144.0" dy="0.0">pull: fetch desired state from Git</tspan></text><line x1="560" y1="1183" x2="630" y2="1183" stroke="#1971c2" stroke-width="3" marker-end="url(#m-blue)"/><text x="644.0" y="1188.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="644.0" dy="0.0">apply: write into a cluster</tspan></text><line x1="1000" y1="1183" x2="1070" y2="1183" stroke="#e8590c" stroke-width="3" marker-end="url(#m-orange)"/><text x="1084.0" y="1188.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="1084.0" dy="0.0">agent connects out to a central hub</tspan></text></svg>
