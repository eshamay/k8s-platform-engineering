<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="524" viewBox="0 0 1000 524" role="img" aria-label="A controller&#x27;s requests first pass a client-side limiter inside the process, then reach the API server where API Priority and Fairness sorts them by FlowSchema into priority levels and queues, rejecting with HTTP 429 when a level saturates, before the surviving requests reach etcd."><title>Two throttling layers on the request path</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="524" fill="#ffffff"/><rect x="20" y="60" width="310" height="200" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><rect x="350" y="60" width="480" height="200" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2" stroke-dasharray="8 6"/><text x="30.0" y="41.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="start"><tspan x="30.0" dy="0.0">Layer 1: inside the controller process</tspan></text><text x="360.0" y="41.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9c36b5" text-anchor="start"><tspan x="360.0" dy="0.0">Layer 2: inside the API server</tspan></text><rect x="35" y="120" width="110" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="90.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="90.0" dy="0.0">Controller</tspan><tspan x="90.0" dy="20.0">reconciler</tspan></text><rect x="180" y="120" width="135" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="247.5" y="146.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="247.5" dy="0.0">Client</tspan><tspan x="247.5" dy="18.8">limiter</tspan><tspan x="247.5" dy="18.8">QPS, burst</tspan></text><rect x="365" y="120" width="130" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="430.0" y="156.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="430.0" dy="0.0">FlowSchema</tspan><tspan x="430.0" dy="18.8">classifies</tspan></text><rect x="515" y="120" width="130" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="580.0" y="146.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="580.0" dy="0.0">Priority</tspan><tspan x="580.0" dy="18.8">levels</tspan><tspan x="580.0" dy="18.8">own shares</tspan></text><rect x="665" y="120" width="150" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="740.0" y="146.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="740.0" dy="0.0">Queues</tspan><tspan x="740.0" dy="18.8">shuffle</tspan><tspan x="740.0" dy="18.8">sharding</tspan></text><rect x="860" y="120" width="110" height="80" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="915.0" y="166.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="915.0" dy="0.0">etcd</tspan></text><rect x="515" y="320" width="150" height="70" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="590.0" y="351.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="590.0" dy="0.0">Reject</tspan><tspan x="590.0" dy="20.0">HTTP 429</tspan></text><text x="110.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="110.0" dy="0.0">Delays requests in process</tspan></text><text x="365.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="365.0" dy="0.0">Saturation is per level</tspan></text><polyline points="145.0,160.0 180.0,160.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="315.0,160.0 365.0,160.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="495.0,160.0 515.0,160.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="645.0,160.0 665.0,160.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="815.0,160.0 860.0,160.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="580.0,200.0 590.0,320.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="620.0" y="306.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="620.0" dy="0.0">level saturates</tspan></text><polyline points="515.0,355.0 95.0,355.0 90.0,200.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><rect x="20" y="450" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,482.0 100.0,482.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="112.0" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">request passes on</tspan></text><polyline points="282.9,482.0 342.9,482.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="354.9" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="354.9" dy="0.0">rejection</tspan></text><polyline points="464.2,482.0 524.2,482.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="536.2" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="536.2" dy="0.0">answer returned</tspan></text></svg>
