a, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="395.0" dy="0.0">Application</tspan><tspan x="395.0" dy="18.8">controller</tspan></text><rect x="530" y="80" width="430" height="210" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/><text x="542.0" y="103.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="542.0" dy="0.0">Each controller owns its own custom resources</tspan></text><rect x="545" y="135" width="125" height="110" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="607.5" y="186.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="607.5" dy="0.0">Small</tspan><tspan x="607.5" dy="18.8">controller</tspan></text><rect x="685" y="135" width="125" height="110" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="747.5" y="186.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="747.5" dy="0.0">Small</tspan><tspan x="747.5" dy="18.8">controller</tspan></text><rect x="825" y="135" width="120" height="110" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="885.0" y="186.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="885.0" dy="0.0">Small</tspan><tspan x="885.0" dy="18.8">controller</tspan></text><rect x="40" y="345" width="430" height="120" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="255.0" y="401.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="255.0" dy="0.0">Drift: report</tspan><tspan x="255.0" dy="20.0">Reports OutOfSync; heals if enabled</tspan></text><rect x="40" y="485" width="430" height="120" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="255.0" y="541.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="255.0" dy="0.0">Prune: opt-in</tspan><tspan x="255.0" dy="20.0">Guard against an empty source</tspan></text><rect x="530" y="345" width="430" height="120" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="745.0" y="401.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="745.0" dy="0.0">Drift: enforce</tspan><tspan x="745.0" dy="20.0">Reverts manual edits each reconcile</tspan></text><rect x="530" y="485" width="430" height="120" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="745.0" y="541.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="745.0" dy="0.0">Prune: when enabled</tspan><tspan x="745.0" dy="20.0">Per-object opt-out and a deletion policy</tspan></text></svg>
