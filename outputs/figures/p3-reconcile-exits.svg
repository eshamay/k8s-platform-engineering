<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="A finished reconcile pass branches into four return values: an empty result with no error means converged, a RequeueAfter delay means healthy but waiting, a non-nil error means a failed attempt requeued with exponential backoff, and a TerminalError is logged and counted but not retried."><title>Four ways a reconcile pass can end</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="540" fill="#ffffff"/><text x="420.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9c36b5" text-anchor="middle"><tspan x="420.0" dy="0.0">What the reconciler returns</tspan></text><text x="810.0" y="35.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9c36b5" text-anchor="middle"><tspan x="810.0" dy="0.0">What the workqueue does next</tspan></text><rect x="30" y="210" width="170" height="100" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="115.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="115.0" dy="0.0">Reconcile pass</tspan><tspan x="115.0" dy="20.0">ends</tspan></text><rect x="270" y="60" width="300" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="420.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420.0" dy="0.0">Empty result,</tspan><tspan x="420.0" dy="20.0">nil error</tspan></text><rect x="270" y="180" width="300" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="420.0" y="216.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420.0" dy="0.0">RequeueAfter</tspan><tspan x="420.0" dy="20.0">delay</tspan></text><rect x="270" y="300" width="300" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="420.0" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420.0" dy="0.0">Non-nil error</tspan></text><rect x="270" y="420" width="300" height="80" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="420.0" y="466.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420.0" dy="0.0">TerminalError</tspan></text><rect x="650" y="60" width="320" height="80" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="810.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="810.0" dy="0.0">Converged</tspan><tspan x="810.0" dy="20.0">idle until next watch event</tspan></text><rect x="650" y="180" width="320" height="80" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/><text x="810.0" y="216.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="810.0" dy="0.0">Healthy but waiting</tspan><tspan x="810.0" dy="20.0">returns after the delay</tspan></text><rect x="650" y="300" width="320" height="80" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="810.0" y="336.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="810.0" dy="0.0">Attempt failed</tspan><tspan x="810.0" dy="20.0">requeued with exponential backoff</tspan></text><rect x="650" y="420" width="320" height="80" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text x="810.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="810.0" dy="0.0">Logged and counted</tspan><tspan x="810.0" dy="20.0">not retried</tspan></text><polyline points="200.0,260.0 270.0,100.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="200.0,260.0 270.0,220.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="200.0,260.0 270.0,340.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="115.0,310.0 115.0,460.0 270.0,460.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="570.0,100.0 650.0,100.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="570.0,220.0 650.0,220.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="570.0,340.0 650.0,340.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><polyline points="570.0,460.0 650.0,460.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/></svg>
