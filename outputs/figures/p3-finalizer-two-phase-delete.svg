<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="524" viewBox="0 0 1000 524" role="img" aria-label="A client&#x27;s delete reaches the API server, which sets a deletion timestamp on the object, a watching controller cleans up the external resource and removes its finalizer, and the empty list lets the object be deleted."><title>How a finalizer turns delete into two steps</title><defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1971c2"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker><marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a40"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#099268"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c36b5"/></marker></defs><rect width="1000" height="524" fill="#ffffff"/><rect x="30" y="110" width="140" height="80" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="100.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="100.0" dy="0.0">Client</tspan></text><rect x="230" y="110" width="140" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="300.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="300.0" dy="0.0">API server</tspan></text><rect x="560" y="100" width="160" height="100" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="640.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="640.0" dy="0.0">Terminating</tspan><tspan x="640.0" dy="20.0">object</tspan><tspan x="640.0" dy="20.0">finalizer</tspan><tspan x="640.0" dy="20.0">listed</tspan></text><rect x="850" y="110" width="120" height="80" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="910.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="910.0" dy="0.0">Object</tspan><tspan x="910.0" dy="20.0">deleted</tspan></text><rect x="560" y="320" width="160" height="80" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/><text x="640.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="640.0" dy="0.0">Controller</tspan></text><rect x="820" y="320" width="150" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="895.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="895.0" dy="0.0">External</tspan><tspan x="895.0" dy="20.0">resource</tspan></text><polyline points="170.0,150.0 230.0,150.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="176.9" y="140.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="176.9" dy="0.0">delete</tspan></text><polyline points="370.0,150.0 560.0,150.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="403.4" y="118.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#099268" text-anchor="start"><tspan x="403.4" dy="0.0">1. set timestamp</tspan></text><polyline points="600.0,200.0 600.0,320.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="487.6" y="250.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9c36b5" text-anchor="start"><tspan x="487.6" dy="0.0">sees update</tspan></text><polyline points="680.0,320.0 680.0,200.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="681.9" y="250.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#099268" text-anchor="start"><tspan x="681.9" dy="0.0">3. remove finalizer</tspan></text><polyline points="720.0,360.0 820.0,360.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="727.6" y="350.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="727.6" dy="0.0">2. clean up</tspan></text><polyline points="720.0,150.0 850.0,150.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="735.0" y="116.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="735.0" dy="0.0">4. list empty</tspan></text><rect x="20" y="450" width="960" height="64" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><polyline points="40.0,482.0 100.0,482.0" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#m-red)"/><text x="112.0" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="112.0" dy="0.0">delete or cleanup</tspan></text><polyline points="282.9,482.0 342.9,482.0" fill="none" stroke="#099268" stroke-width="3" marker-end="url(#m-green)"/><text x="354.9" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="354.9" dy="0.0">update to the object</tspan></text><polyline points="548.9,482.0 608.9,482.0" fill="none" stroke="#9c36b5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m-purple)"/><text x="620.9" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="620.9" dy="0.0">watch notification</tspan></text><polyline points="799.5,482.0 859.5,482.0" fill="none" stroke="#343a40" stroke-width="3" marker-end="url(#m-dark)"/><text x="871.5" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="871.5" dy="0.0">result</tspan></text></svg>
